databases:
  - name: wiki-edit-trends-db
    plan: free
    databaseName: wiki_edits
    ipAllowList: []

services:
  - type: web
    name: wiki-edit-trends-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: wiki-edit-trends-db
          property: connectionString

  - type: worker
    name: wiki-edit-trends-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m ingestion
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: wiki-edit-trends-db
          property: connectionString
